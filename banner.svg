<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="760" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="760" height="180" fill="url(#bgGrad)" rx="8"/>
  <rect x="0" y="0" width="760" height="2" fill="url(#accent)" opacity="0.7"/>
  <rect x="0" y="178" width="760" height="2" fill="#10b981" opacity="0.4"/>

  <!-- Robot icon -->
  <g transform="translate(88, 72)" filter="url(#glow)">
    <!-- Body -->
    <rect x="-24" y="-6" width="48" height="36" rx="6" fill="none" stroke="#f0883e" stroke-width="2"/>
    <!-- Head -->
    <rect x="-18" y="-32" width="36" height="24" rx="5" fill="none" stroke="#f0883e" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-7" cy="-20" r="4" fill="#f0883e" opacity="0.8"/>
    <circle cx="7" cy="-20" r="4" fill="#f0883e" opacity="0.8"/>
    <!-- Pupils -->
    <circle cx="-6" cy="-20" r="1.5" fill="#0d1117"/>
    <circle cx="8" cy="-20" r="1.5" fill="#0d1117"/>
    <!-- Antenna -->
    <line x1="0" y1="-32" x2="0" y2="-44" stroke="#f0883e" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="0" cy="-46" r="3" fill="#10b981" opacity="0.8" filter="url(#glow)"/>
    <!-- Arms -->
    <line x1="-24" y1="4" x2="-34" y2="-4" stroke="#f0883e" stroke-width="2" stroke-linecap="round"/>
    <line x1="24" y1="4" x2="34" y2="-4" stroke="#f0883e" stroke-width="2" stroke-linecap="round"/>
    <!-- Chest display -->
    <rect x="-10" y="4" width="20" height="10" rx="2" fill="none" stroke="#f0883e" stroke-width="1" opacity="0.5"/>
    <line x1="-6" y1="9" x2="-2" y2="9" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <line x1="1" y1="9" x2="6" y2="9" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <!-- Legs -->
    <line x1="-10" y1="30" x2="-10" y2="42" stroke="#f0883e" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="30" x2="10" y2="42" stroke="#f0883e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Accent divider -->
  <line x1="148" y1="28" x2="148" y2="155" stroke="#f0883e" stroke-width="1" opacity="0.2"/>

  <!-- Faded terminal output (right side) -->
  <g font-family="'Courier New', Courier, monospace" font-size="9" fill="#f0883e" opacity="0.1">
    <text x="580" y="32">BUY  SPY 520c  x2</text>
    <text x="580" y="46">FILL 520c @ $1.42</text>
    <text x="580" y="60">STOP @ $1.14</text>
    <text x="580" y="74">TGRT @ $1.85</text>
    <text x="580" y="88">P/L: +$86.00</text>
    <text x="580" y="102">SELL 520c  TRAIL</text>
    <text x="580" y="116">WIN  12/15 (80%)</text>
    <text x="580" y="130">SCAN: 14 tickers</text>
    <text x="580" y="144">NEXT: 09:31:00</text>
    <text x="580" y="158">MODE: PAPER</text>
  </g>

  <!-- Title -->
  <text x="164" y="58" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="bold" fill="#f0883e" filter="url(#glow)">Webot</text>

  <!-- Subtitle -->
  <text x="166" y="84" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8b949e">Autonomous Webull Trading Bot</text>

  <!-- Description -->
  <text x="166" y="110" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484f58">EMA/SMA + RSI momentum  ·  Stop-loss &amp; trailing stops  ·  Paper/live</text>

  <!-- Badges -->
  <g font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700">
    <rect x="166" y="122" width="52" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="192" y="134" fill="#f0883e" text-anchor="middle">python</text>
    <rect x="224" y="122" width="42" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="245" y="134" fill="#6b7280" text-anchor="middle">YAML</text>
    <rect x="272" y="122" width="52" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="298" y="134" fill="#6b7280" text-anchor="middle">webull</text>
    <rect x="330" y="122" width="72" height="16" rx="3" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="366" y="134" fill="#6b7280" text-anchor="middle">risk mgmt</text>
  </g>

  <!-- Author -->
  <text x="166" y="160" font-family="'Courier New', Courier, monospace" font-size="11" fill="#484f58">SkyzFallin</text>
</svg>
